name: Vinted Watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python vinted_watcher.py

      - name: Save seen items back to repo
        run: |
          git config user.name "vinted-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_items.json
          git diff --quiet --cached || git commit -m "Update seen items"
          git push
